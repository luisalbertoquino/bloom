<!-- src/app/shared/components/promotional-popup/promotional-popup.component.html -->
<!-- Overlay -->
<div *ngIf="isVisible && popup"
     class="popup-overlay fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-[100] p-4"
     (click)="close()">

  <!-- Popup Modal -->
  <div class="popup-modal rounded-lg w-full relative animate-popup"
       [ngClass]="hasOnlyImage() ? 'max-w-2xl' : 'max-w-md bg-white shadow-2xl'"
       (click)="$event.stopPropagation()">

    <!-- Botón de cerrar -->
    <button (click)="close()"
            class="absolute top-3 right-3 transition-colors z-10"
            [ngClass]="hasOnlyImage() ? 'text-white hover:text-gray-200 bg-black bg-opacity-40 rounded-full p-1' : 'text-gray-400 hover:text-gray-600'"
            aria-label="Cerrar">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Imagen (si existe) -->
    <img *ngIf="popup.image"
         [src]="getImageUrl(popup.image)"
         [alt]="popup.title || 'Promoción'"
         [ngClass]="hasOnlyImage() ? 'w-full aspect-square rounded-lg object-cover' : 'w-full h-auto rounded-t-lg object-cover max-h-64'">

    <!-- Contenido del popup (solo si hay título, contenido o botón) -->
    <div *ngIf="popup.title || popup.content || popup.button_text"
         class="p-6"
         [class.pt-12]="!popup.image">
      <!-- Título -->
      <h2 *ngIf="popup.title" class="text-2xl font-bold text-gray-900 mb-3">
        {{ popup.title }}
      </h2>

      <!-- Contenido -->
      <div *ngIf="popup.content" class="text-gray-700 mb-6 whitespace-pre-line">
        {{ popup.content }}
      </div>

      <!-- Botón de acción -->
      <button *ngIf="popup.button_text"
              (click)="onButtonClick()"
              class="w-full bg-primary text-white font-semibold py-3 px-6 rounded-lg hover:bg-primary-dark transition-colors shadow-md">
        {{ popup.button_text }}
      </button>
    </div>
  </div>
</div>
